name: Build debug APK (with bandwidth test)

# Same pipeline as build.yml, with two differences:
#  1. libv2ray.aar is built from the pinned AndroidLibXrayLite submodule after
#     adding bandwidth/bandwidth.go (instead of downloading the stock release).
#  2. It builds debug APKs (signed with the debug key), so no keystore secrets
#     are needed. Install the arm64-v8a APK on most phones.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Go (version from the library's go.mod)
      uses: actions/setup-go@v5
      with:
        go-version-file: AndroidLibXrayLite/go.mod

    - name: Add bandwidth test to the Go library
      run: |
        grep -q "func MeasureOutboundDelay" AndroidLibXrayLite/*.go || {
          echo "MeasureOutboundDelay not found in AndroidLibXrayLite; submodule layout changed"; exit 1; }
        cp bandwidth/bandwidth.go AndroidLibXrayLite/bandwidth.go

    - name: Build libv2ray.aar
      working-directory: AndroidLibXrayLite
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH="$PATH:$(go env GOPATH)/bin"
        gomobile init
        go get golang.org/x/mobile/bind
        go mod tidy -v
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp libv2ray.aar ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar

    - name: Build debug APKs
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: v2rayNG-bandwidth-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*.apk
